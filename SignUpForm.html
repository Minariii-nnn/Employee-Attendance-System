<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #C8E0C8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .signup-container {
      background: #8AA874;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(73, 90, 74, 0.2);
      width: 320px;
      color: #2E3A2F;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .signup-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #495A4A;
    }

    .signup-container p {
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      color: #BBCD83;
      margin-bottom: 10px;
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    form input[type="text"],
    form input[type="password"],
    form input[type="email"] {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #C8E0C8;
      border-radius: 5px;
      background-color: #C8E0C8;
      color: #2E3A2F;
      font-size: 14px;
    }

    form button {
      width: 90%;
      padding: 10px;
      background-color: #556E46;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 12px;
      transition: background-color 0.3s, transform 0.2s;
    }

    form button:hover {
      background-color: #495A4A;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <p>Time Keeper</p>
    <h2>Sign Up</h2>
    <form onsubmit="redirect(event)">
      <input type="text" name="fullname" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email Address" required />
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Sign Up</button>
    </form>
  </div>

  <script>
    function redirect(event) {
      event.preventDefault();
      window.location.href = "loginform.html";
    }
  </script>
</body>
</html>
